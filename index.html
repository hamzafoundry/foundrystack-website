<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E9EDF1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // The pre-built page is English. A visitor who chose another language would see
      // English flash first, so hide the page until their language has loaded.
      try {
        var l = localStorage.getItem('foundry_lang');
        if (l && l !== 'en') {
          var r = document.documentElement;
          r.classList.add('lang-pending');
          r.lang = l;
          if (l === 'ar') r.dir = 'rtl';
          setTimeout(function () { r.classList.remove('lang-pending'); }, 4000);
        }
      } catch (e) {}
    </script>
    <style>.lang-pending #root { visibility: hidden; }</style>
    <title>FoundryStack | AI automation and custom software for small businesses</title>
    <meta name="description" content="We automate data entry, follow-ups and reports, build websites that bring enquiries, and connect your tools." />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
