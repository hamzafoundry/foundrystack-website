name: Check and deploy

# Pull requests into main: type-check and build only.
# Merges (pushes) to main: the same checks, then deploy to Cloud Run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button (deploys only when run on main)

# Never run two production deploys at once; a newer PR check replaces an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependency versions
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Build (client, pre-rendered HTML, server)
        run: npm run build

  deploy:
    name: Deploy to Cloud Run
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # lets GitHub prove its identity to Google: no stored keys
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Builds the Dockerfile with Cloud Build and rolls out a new revision.
      # Environment variables, secrets and the runtime service account already set
      # on the service are kept: this only replaces the code.
      - name: Deploy
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.CLOUD_RUN_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          source: ./
          flags: --port=3000

      # 1) The new revision itself must be healthy (hard fail if not).
      # 2) The public domain should serve it too; if it does not, the deploy still
      #    succeeded, so this warns and prints what the domain actually returned.
      - name: Smoke test the live site
        env:
          RUN_URL: ${{ steps.deploy.outputs.url }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://foundrystack.net' }}
        run: |
          is_new_build() {
            curl -fsS --max-time 15 "$1/api/health" | grep -q '"brand":"FoundryStack"' &&
            curl -fsS --max-time 15 "$1/" | grep -q '<h1'
          }
          show() {
            echo "--- $1/api/health"
            curl -sS --max-time 15 -o /dev/stderr -w "\nHTTP %{http_code}, IP %{remote_ip}\n" "$1/api/health" 2>&1 | head -c 600; echo
            echo "--- DNS for ${1#https://}"
            getent hosts "${1#https://}" || echo "no DNS record"
          }

          for attempt in 1 2 3 4 5 6; do
            if is_new_build "$RUN_URL"; then echo "Cloud Run revision is healthy: $RUN_URL"; break; fi
            if [ "$attempt" = 6 ]; then show "$RUN_URL"; echo "::error::New Cloud Run revision is not healthy: $RUN_URL"; exit 1; fi
            echo "Attempt $attempt: Cloud Run not ready, retrying in 15s"; sleep 15
          done

          for attempt in 1 2 3 4; do
            if is_new_build "$PUBLIC_URL"; then echo "$PUBLIC_URL is serving the new build"; exit 0; fi
            echo "Attempt $attempt: $PUBLIC_URL not serving the new build yet, retrying in 15s"; sleep 15
          done
          show "$PUBLIC_URL"
          echo "::warning::Deployed OK to $RUN_URL, but $PUBLIC_URL is not serving it. Check the domain mapping / DNS for $PUBLIC_URL."
